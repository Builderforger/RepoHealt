{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<p class="note">{{ text }}</p>

{% if steps %}
<ol class="steps">
    {% for step in steps %}
    <li>{{ step }}</li>
    {% endfor %}
</ol>
{% endif %}

<p><a href="/">← к рейтингу</a></p>
{% endblock %}

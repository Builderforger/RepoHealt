# Добавка к основному docker-compose.yml для публичного стенда.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Наружу смотрит только прокси. Сам сайт в проде слушает
# localhost (WEB_BIND в .env), чтобы в него нельзя было
# зайти мимо прокси.

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_SITE: ${PUBLIC_SITE:-http://}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-config:
  caddy-data:

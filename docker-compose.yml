# Полный запуск сервиса: движок оценки и сайт.
#
#   docker compose up --build
#
# Сбор данных запускается отдельной командой, см. README.

services:
  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    environment:
      # Служебный токен: им обходится публичный каталог.
      # Личные разборы идут с токеном пользователя, он приходит
      # заголовком запроса и нигде не сохраняется.
      SC_TOKEN: ${SC_TOKEN:-}
      # Адрес API проверок безопасности. В спецификации он не указан,
      # поэтому оставлен настраиваемым.
      APPSEC_BASE_URL: ${APPSEC_BASE_URL:-}
    volumes:
      - repohealth-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "dotnet /app/cli/RepoHealth.Cli.dll > /dev/null 2>&1 || true"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Периодический пересчёт. Обход инкрементальный: заново
  # скачиваются только изменившиеся проекты, поэтому первый
  # проход долгий, а каждый следующий короткий.
  worker:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    entrypoint: ["dotnet", "/app/worker/RepoHealth.Worker.dll"]
    environment:
      SC_TOKEN: ${SC_TOKEN:-}
      REPOHEALTH_DATA: /data
      REPOHEALTH_INTERVAL_HOURS: ${REPOHEALTH_INTERVAL_HOURS:-6}
      REPOHEALTH_LIMIT: ${REPOHEALTH_LIMIT:-0}
    volumes:
      - repohealth-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      REPOHEALTH_DB: /data/repohealth.db
      REPOHEALTH_ENGINE: http://engine:8080
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost:8010/auth/callback}
    ports:
      # Локально это 8010 на всех адресах. На публичном стенде
      # в .env пишется WEB_BIND=127.0.0.1:8010, и тогда снаружи
      # сайт доступен только через прокси.
      - "${WEB_BIND:-8010}:8000"
    volumes:
      - repohealth-data:/data
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  repohealth-data:
